# /etc/nginx/conf.d/trading-upstream.conf
# Upstream del API de trading. UN solo color activo a la vez (blue-green). El
# deploy reescribe SOLO la línea `server` (8100 <-> 8101) IN-PLACE (> archivo,
# NO mv: ubuntu es dueño del archivo pero NO del dir root /etc/nginx/conf.d, así
# que un mv-replace ahí falla con Permission denied) y hace `nginx -s reload`.
# El reload no corta conexiones establecidas; la escritura es un printf de 3
# líneas seguido de nginx -t, riesgo de lectura parcial despreciable.
#
# El server block trading.sdar.dev.conf debe apuntar sus `proxy_pass` a
# http://trading_api/ (en vez de http://127.0.0.1:8100/) — ese cambio se hace
# UNA vez en el cutover (ver deploy/CUTOVER.md), no por el deploy.
upstream trading_api {
    server 127.0.0.1:8100;
}
