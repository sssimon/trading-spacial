# ============================================================================
# DISABLED — atomic deploy migration was reverted (PR #377 closed)
# ============================================================================
# Este workflow está retenido como herramienta diagnóstica pero el approach
# de atomic deploy fue revertido. Tres bloqueos no resueltos:
#   1. Shebangs del venv (status=203/EXEC) tras mover .venv
#   2. ReadWritePaths vs symlinks → SQLite readonly
#   3. SQLite WAL + cwd-vía-symlink → "attempt to write a readonly database"
# Ver el closing comment de PR #377 para el análisis completo y las 3
# opciones forward (PYTHONPATH v3, eliminar WAL, migrar a Postgres).
#
# Los modos apply/repair/rollback están bloqueados por un gate explícito.
# Solo diagnose y dry-run son ejecutables sin override.
# ============================================================================
#
# One-shot workflow para correr scripts/bootstrap-atomic-deploy.sh en el
# server vía SSH usando los mismos secrets que deploy.yml. Es de disparo
# manual (workflow_dispatch) — NO se ejecuta automáticamente.
#
# Modos:
#   diagnose = print server state (read-only, siempre safe)
#   dry-run  = preview de qué haría el bootstrap sin ejecutarlo
#   apply    = ejecuta el bootstrap (DISABLED — requiere ack explícito)
#   repair   = post-bootstrap fix (DISABLED — requiere ack explícito)
#   rollback = revierte al layout flat (DISABLED — requiere ack explícito)
#
# Uso:
#   gh workflow run "Bootstrap atomic deploy" -f mode=diagnose
#   gh workflow run "Bootstrap atomic deploy" -f mode=apply \
#     -f i_understand_pr_377_was_closed=yes

name: Bootstrap atomic deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = read-only state; dry-run = preview; apply/repair/rollback = DISABLED unless ack'
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - dry-run
          - apply
          - repair
          - rollback
      i_understand_pr_377_was_closed:
        description: 'Required for apply/repair/rollback. Set to "yes" to override the disabled gate.'
        required: false
        type: string
        default: 'no'

jobs:
  bootstrap:
    name: Bootstrap server (mode=${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Disabled gate — block apply/repair/rollback without ack
        env:
          MODE: ${{ inputs.mode }}
          ACK: ${{ inputs.i_understand_pr_377_was_closed }}
        run: |
          case "$MODE" in
            diagnose|dry-run)
              echo "::notice::Mode '$MODE' is read-only/preview — gate bypassed."
              exit 0
              ;;
            apply|repair|rollback)
              if [ "$ACK" != "yes" ]; then
                echo "::error::Mode '$MODE' is DISABLED. Atomic deploy migration was reverted (PR #377 closed)."
                echo "::error::To override, re-run with i_understand_pr_377_was_closed=yes."
                echo "::error::See PR #377 closing comment for the 3 forward options before re-enabling."
                exit 1
              fi
              echo "::warning::Override accepted for mode '$MODE'. Proceeding despite PR #377 being closed."
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST:    ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload bootstrap script to server
        if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'apply' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key \
            scripts/bootstrap-atomic-deploy.sh \
            ubuntu@${HOST}:/tmp/bootstrap-atomic-deploy.sh
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} \
            "chmod +x /tmp/bootstrap-atomic-deploy.sh"

      - name: Run bootstrap (dry-run or apply)
        if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'apply' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "dry-run" ]; then
            FLAG="--dry-run"
          else
            FLAG="--yes --i-understand-pr-377-was-closed"
          fi
          echo "::group::Running bootstrap with $FLAG"
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} \
            "/tmp/bootstrap-atomic-deploy.sh $FLAG"
          echo "::endgroup::"

      - name: Repair post-bootstrap
        # Aplica dos fixes que el bootstrap inicial dejó pendientes:
        #
        #   1. Symlink legacy .venv: los binarios dentro de .venv/bin/ tienen
        #      shebangs absolutos (#!/var/www/trading/.venv/bin/python). Al
        #      mover .venv a shared/, esos shebangs apuntan a un path que ya
        #      no existe. Creamos /var/www/trading/.venv → shared/.venv para
        #      que los shebangs resuelvan.
        #
        #   2. Ensanchar ReadWritePaths: el bootstrap rewrote
        #      `ReadWritePaths=/var/www/trading` → `.../current`. Pero systemd
        #      resuelve symlinks antes de aplicar la sandbox, así que el DB en
        #      shared/data/ queda fuera del whitelist (readonly). Volvemos a
        #      `ReadWritePaths=/var/www/trading` que cubre current/ + shared/.
        if: ${{ inputs.mode == 'repair' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} 'bash -s' << 'REMOTE_SCRIPT'
            set -euo pipefail

            BASE=/var/www/trading
            UNIT=/etc/systemd/system/trading-spacial.service

            echo "==> Estado pre-repair:"
            sudo systemctl status trading-spacial --no-pager -n 0 || true
            echo

            echo "==> Verificando que el bootstrap haya corrido..."
            if [ ! -L "$BASE/current" ]; then
              echo "::error::$BASE/current no existe — ¿bootstrap no ejecutado?"
              exit 1
            fi
            if [ ! -d "$BASE/shared/.venv" ]; then
              echo "::error::$BASE/shared/.venv no existe"
              exit 1
            fi
            echo "    OK: current → $(readlink $BASE/current)"
            echo "    OK: shared/.venv presente"
            echo

            echo "==> Parando trading-spacial..."
            sudo systemctl stop trading-spacial || true
            sudo systemctl reset-failed trading-spacial || true
            echo

            # ── Fix 1: legacy .venv symlink ─────────────────────────
            if [ -e "$BASE/.venv" ]; then
              if [ -L "$BASE/.venv" ]; then
                echo "==> $BASE/.venv ya es un symlink → $(readlink $BASE/.venv)"
              else
                echo "::error::$BASE/.venv existe pero NO es symlink. Resolver a mano."
                exit 1
              fi
            else
              echo "==> Creando symlink $BASE/.venv → shared/.venv"
              sudo ln -s "$BASE/shared/.venv" "$BASE/.venv"
            fi

            echo "==> Verificando que uvicorn sea ejecutable vía el symlink:"
            ls -la "$BASE/.venv/bin/uvicorn"
            echo

            # ── Fix 2: ensanchar ReadWritePaths ──────────────────────
            CURRENT_RWP=$(grep -E "^ReadWritePaths=" "$UNIT" || true)
            echo "==> ReadWritePaths actual: $CURRENT_RWP"

            if grep -qE "^ReadWritePaths=/var/www/trading/current$" "$UNIT"; then
              echo "==> Revirtiendo ReadWritePaths a /var/www/trading (cubre current + shared)"
              sudo sed -i 's|^ReadWritePaths=/var/www/trading/current$|ReadWritePaths=/var/www/trading|' "$UNIT"
              sudo systemctl daemon-reload
              echo "==> Nuevo: $(grep -E '^ReadWritePaths=' "$UNIT")"
            else
              echo "==> ReadWritePaths no necesita cambio (no match con el patrón conocido)"
            fi
            echo

            echo "==> Arrancando trading-spacial..."
            sudo systemctl start trading-spacial

            echo "==> Esperando 8s y health check..."
            sleep 8

            if curl -fsS http://localhost:8100/health > /dev/null; then
              echo "==> ✓ Repair completado. Service activo:"
              sudo systemctl status trading-spacial --no-pager -n 5
            else
              echo "::error::Health check falló post-repair."
              sudo journalctl -u trading-spacial -n 40 --no-pager
              exit 1
            fi
          REMOTE_SCRIPT

      - name: Diagnose — print server state
        # No tocar nada — solo printar info útil para entender el estado actual
        # y planificar el siguiente intento de bootstrap. Filtra secrets del .env.
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} 'bash -s' << 'REMOTE_SCRIPT'
            set -euo pipefail
            BASE=/var/www/trading
            UNIT=/etc/systemd/system/trading-spacial.service

            echo "=========================================="
            echo "  Layout actual de $BASE"
            echo "=========================================="
            ls -la "$BASE" | head -30
            echo

            echo "=========================================="
            echo "  systemd unit"
            echo "=========================================="
            sudo cat "$UNIT"
            echo

            echo "=========================================="
            echo "  systemctl status"
            echo "=========================================="
            sudo systemctl status trading-spacial --no-pager -n 5 || true
            echo

            echo "=========================================="
            echo "  .env (sólo claves con path, valores ocultos)"
            echo "=========================================="
            # Imprime cada línea KEY=VALUE pero solo muestra VALUE si parece path
            # (empieza con / o . y NO contiene `=` después). Maskea tokens.
            if [ -f "$BASE/.env" ]; then
              while IFS= read -r line; do
                case "$line" in
                  ''|\#*) continue ;;
                esac
                key="${line%%=*}"
                val="${line#*=}"
                # Solo printar valores que parezcan paths
                case "$val" in
                  /*|\./*|~/*)
                    echo "  $key = $val"
                    ;;
                  *)
                    echo "  $key = <hidden> (len=${#val})"
                    ;;
                esac
              done < <(sudo cat "$BASE/.env")
            else
              echo "  ::warning::$BASE/.env no existe"
            fi
            echo

            echo "=========================================="
            echo "  Permissions de directorios críticos"
            echo "=========================================="
            for d in "$BASE/.env" "$BASE/.venv" "$BASE/data" "$BASE/shared" "$BASE/current" "$BASE/releases"; do
              if [ -e "$d" ] || [ -L "$d" ]; then
                ls -lad "$d"
              else
                echo "  $d → NO EXISTE"
              fi
            done
            echo

            echo "=========================================="
            echo "  Tail de journalctl"
            echo "=========================================="
            sudo journalctl -u trading-spacial -n 20 --no-pager 2>&1 | tail -20
          REMOTE_SCRIPT

      - name: Rollback — revertir al layout flat (v2)
        # Con el nuevo diseño (.env, .venv, data NO se mueven), el rollback es:
        #   1. Stop service
        #   2. Restaurar systemd unit desde .bak
        #   3. Mover archivos de código desde releases/<sha>/ al root
        #      (skipeando los symlinks .env, .venv, data que apuntan a root)
        #   4. Borrar symlink current y dir releases/
        #   5. daemon-reload + start + health check
        if: ${{ inputs.mode == 'rollback' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} 'bash -s' << 'REMOTE_SCRIPT'
            set -euo pipefail

            BASE=/var/www/trading
            UNIT=/etc/systemd/system/trading-spacial.service

            echo "==> Pre-rollback state:"
            ls -la "$BASE" | head -20
            echo

            if [ ! -L "$BASE/current" ]; then
              echo "==> $BASE/current no existe — nada que rollback."
              exit 0
            fi

            RELEASE_DIR=$(readlink -f "$BASE/current")
            echo "==> Release activo a rollback: $RELEASE_DIR"
            echo

            echo "==> Step 1: Parando trading-spacial..."
            sudo systemctl stop trading-spacial || true
            sudo systemctl reset-failed trading-spacial || true
            echo

            echo "==> Step 2: Restaurar systemd unit desde el .bak más reciente"
            LATEST_BAK=$(ls -t ${UNIT}.bak.* 2>/dev/null | head -n1 || true)
            if [ -z "$LATEST_BAK" ]; then
              echo "::warning::No hay backup del unit. Aplicando sed inverso."
              sudo sed -i 's|^WorkingDirectory=/var/www/trading/current$|WorkingDirectory=/var/www/trading|' "$UNIT"
            else
              echo "    Backup más reciente: $LATEST_BAK"
              sudo cp "$LATEST_BAK" "$UNIT"
            fi
            sudo systemctl daemon-reload
            echo

            # Limpiar symlink legacy /var/www/trading/.venv si vino de una versión
            # anterior del bootstrap (v1 con shared/).
            if [ -L "$BASE/.venv" ]; then
              echo "==> Step 3a: Detectado symlink legacy en .venv → $(readlink $BASE/.venv)"
              # Solo borrar si apunta a shared/.venv (de v1); si apunta a .venv real, dejarlo
              case "$(readlink $BASE/.venv)" in
                */shared/.venv) sudo rm "$BASE/.venv"; echo "    Borrado (era de v1 shared)" ;;
                *)              echo "    Mantenido (parece OK)" ;;
              esac
            fi

            echo "==> Step 3: Mover archivos de release back al root"
            echo "          (skip symlinks que apunten a ../../{.env,.venv,data})"
            cd "$RELEASE_DIR"
            for f in * .[!.]*; do
              [ -e "$f" ] || [ -L "$f" ] || continue
              if [ -L "$f" ]; then
                target=$(readlink "$f")
                case "$target" in
                  ../../.env|../../.venv|../../data|../../shared/*)
                    echo "    skip + delete symlink $f → $target"
                    sudo rm "$f"
                    continue
                    ;;
                esac
              fi
              echo "    mv $f → $BASE/$f"
              sudo mv "$f" "$BASE/$f"
            done
            cd /
            echo

            # Limpiar shared/ residual (de v1)
            if [ -d "$BASE/shared" ]; then
              echo "==> Step 3b: Detectado shared/ residual (v1). Limpiando..."
              if [ ! -e "$BASE/.env" ] && [ -e "$BASE/shared/.env" ]; then
                sudo mv "$BASE/shared/.env" "$BASE/.env"
              fi
              if [ ! -e "$BASE/.venv" ] && [ -e "$BASE/shared/.venv" ]; then
                sudo mv "$BASE/shared/.venv" "$BASE/.venv"
              fi
              if [ ! -e "$BASE/data" ] && [ -e "$BASE/shared/data" ]; then
                sudo mv "$BASE/shared/data" "$BASE/data"
              fi
              sudo rm -rf "$BASE/shared"
            fi

            echo "==> Step 4: Borrar symlink current y dir releases/"
            sudo rm "$BASE/current"
            sudo rm -rf "$BASE/releases"
            echo

            echo "==> Step 5: Arrancar trading-spacial..."
            sudo systemctl start trading-spacial
            sleep 8

            if curl -fsS http://localhost:8100/health > /dev/null; then
              echo "==> ✓ Rollback completado. Service activo:"
              sudo systemctl status trading-spacial --no-pager -n 5
            else
              echo "::error::Health check falló post-rollback."
              sudo journalctl -u trading-spacial -n 40 --no-pager
              exit 1
            fi
          REMOTE_SCRIPT

      - name: Cleanup remote script
        if: always() && inputs.mode != 'repair' && inputs.mode != 'rollback' && inputs.mode != 'diagnose'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} \
            "rm -f /tmp/bootstrap-atomic-deploy.sh" || true

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
