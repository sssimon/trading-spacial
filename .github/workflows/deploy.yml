# Deploy in-place. Trade-off conocido: si el rsync de frontend falla
# después del rsync de backend, el sistema queda con backend nuevo y
# frontend viejo hasta el siguiente deploy. Aceptable mientras el sistema
# sea single-user sin capital real. Para capital real, migrar a deploy
# atómico con symlink swap (releases/<sha> → /var/www/trading current).
#
# Bootstrap manual del server requerido ANTES del primer deploy:
#   docs/superpowers/specs/es/2026-04-29-trading-sdar-dev-deploy-design.md §6
# El step "Verify .env exists" abajo falla fast si no se hizo.

name: Deploy to Production

on:
  push:
    branches: [main]
  # Manual trigger: recover a deploy when the push event was not picked up by
  # Actions (observed 2026-05-29 — the #540 squash-merge to main created the
  # commit but no push-triggered run fired, a GitHub-side transient). Run with:
  #   gh workflow run deploy.yml --ref main
  workflow_dispatch:

concurrency:
  group: deploy-production
  # false (NO true): el deploy blue-green muta estado de infra (units + include
  # de nginx) en pasos no-atómicos. Cancelar a media-secuencia dejaría el include
  # apuntando a un color muerto → 502 persistente. Mejor serializar/encolar.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to trading.sdar.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST:    ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify .env exists on server (fail-fast if bootstrap missing)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if ! ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "test -f /var/www/trading/.env"; then
            echo "::error::/var/www/trading/.env no existe en el server."
            echo "::error::Ejecutar bootstrap manual primero (ver docs/superpowers/specs/es/2026-04-29-trading-sdar-dev-deploy-design.md §6)."
            exit 1
          fi

      - name: rsync backend source
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='tests/' --exclude='logs/' \
            --exclude='*.db' --exclude='.venv/' --exclude='__pycache__/' \
            --exclude='frontend/' --exclude='.git/' --exclude='.github/' \
            --exclude='.coverage' --exclude='.pytest_cache/' \
            --exclude='.worktrees/' --exclude='Backtesting_BTCUSDT/' \
            --exclude='Dashboard/' --exclude='docs/' --exclude='*.bat' \
            --exclude='*.ps1' --exclude='.env' --exclude='.env.*' \
            --exclude='.claude/' --exclude='config.json' \
            --exclude='config.json.*.bak' \
            --exclude='data/*.json' --exclude='data/*.csv' \
            --exclude='data/*.xlsx' --exclude='data/backtest/' \
            ./ ubuntu@${HOST}:/var/www/trading/

      - name: rsync frontend dist
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ ubuntu@${HOST}:/var/www/trading/dist/

      - name: Blue-green deploy (zero-downtime)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Server ya migrado a blue-green (deploy/CUTOVER.md): trading-scanner +
          # trading-api@8100/8101, include /etc/nginx/conf.d/trading-upstream.conf
          # (chown ubuntu) y sudoers. El include se reescribe IN-PLACE (> archivo)
          # porque ubuntu es dueño del archivo pero NO del dir /etc/nginx/conf.d
          # (root) — un `mv` ahí falla con Permission denied. La escritura es de
          # 3 líneas en un printf y va seguida de nginx -t; el riesgo de lectura
          # parcial es despreciable.
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/trading
          .venv/bin/pip install --upgrade -r requirements.txt

          INCLUDE=/etc/nginx/conf.d/trading-upstream.conf
          CURRENT=$(grep -oE '127\.0\.0\.1:(8100|8101)' "$INCLUDE" | grep -oE '8100|8101' | head -1)
          [ -n "${CURRENT:-}" ] || { echo "::error::no pude leer el color activo del include"; exit 1; }

          # Self-heal: si el color del include no está vivo, levantarlo antes de empezar.
          if ! sudo systemctl is-active "trading-api@${CURRENT}" >/dev/null 2>&1; then
            echo "self-heal: trading-api@${CURRENT} caído; arrancando…"
            sudo systemctl start "trading-api@${CURRENT}"
            for i in $(seq 1 15); do curl -fsS "http://localhost:${CURRENT}/health/live" >/dev/null 2>&1 && break; sleep 1; done
          fi

          if [ "$CURRENT" = "8100" ]; then INACTIVE=8101; else INACTIVE=8100; fi
          echo "activo=$CURRENT  ->  desplegando a inactivo=$INACTIVE"

          # Arrancar el inactivo con el código nuevo (venv compartido ya actualizado).
          sudo systemctl restart "trading-api@${INACTIVE}"
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${INACTIVE}/health/live" >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then
            echo "::error::trading-api@${INACTIVE} no quedó ready"; sudo journalctl -u "trading-api@${INACTIVE}" -n 50 --no-pager; exit 1
          fi

          # Swap del include IN-PLACE → inactivo + reload (no corta conexiones).
          printf 'upstream trading_api {\n    server 127.0.0.1:%s;\n}\n' "$INACTIVE" > "$INCLUDE"
          sudo nginx -t && sudo nginx -s reload

          # Parar el viejo (drena via --timeout-graceful-shutdown 30).
          sudo systemctl stop "trading-api@${CURRENT}"

          # Reiniciar el scanner con el código nuevo (cero impacto de cliente).
          sudo systemctl restart trading-scanner

          # Verificación final.
          curl -fsS "http://localhost:${INACTIVE}/health/live" >/dev/null

          # Reconciliación de unit drift (warn-only — los units de /etc son
          # world-readable, diff no necesita sudo; el reinstall es manual).
          for u in trading-scanner.service "trading-api@.service"; do
            if ! diff -q "/etc/systemd/system/$u" "deploy/$u" >/dev/null 2>&1; then
              echo "::warning::unit drift en $u — reinstalar a mano: sudo cp deploy/$u /etc/systemd/system/$u && sudo systemctl daemon-reload"
            fi
          done
          echo "blue-green OK: activo ahora :${INACTIVE}"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
