# Atomic deploy con symlink swap.
#
# Layout en el server (creado por scripts/bootstrap-atomic-deploy.sh):
#
#   /var/www/trading/
#   ├── current → releases/<sha>     (symlink al release activo)
#   ├── releases/
#   │   ├── <sha-N>/                  (copy completo de la app por deploy)
#   │   │   ├── btc_api.py / ...
#   │   │   ├── dist/                 (frontend build)
#   │   │   ├── .env    → ../../shared/.env
#   │   │   ├── .venv   → ../../shared/.venv
#   │   │   └── data    → ../../shared/data
#   │   └── <sha-N-1>/                (release anterior — para rollback)
#   └── shared/                       (persiste entre deploys)
#       ├── .env
#       ├── .venv/
#       └── data/
#
# El cutover es atómico (mv -Tf sobre el symlink usa rename(2) atómico de
# Linux). Si el health check falla, se hace rollback automático al release
# anterior antes de devolver exit 1.
#
# Bootstrap manual requerido ANTES del primer deploy con este workflow:
#   docs/atomic-deploy-migration.md
# El step "Verify atomic layout" abajo falla fast si no se hizo.

name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to trading.sdar.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST:    ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify atomic layout (fail-fast if bootstrap missing)
        # Chequeo de que el server ya corrió scripts/bootstrap-atomic-deploy.sh.
        # Sin esto, los rsync/symlink subsiguientes romperían el deploy
        # actual del server. Fail fast antes de tocar nada.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if ! ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "
            test -L /var/www/trading/current &&
            test -d /var/www/trading/releases &&
            test -d /var/www/trading/shared &&
            test -f /var/www/trading/shared/.env &&
            test -d /var/www/trading/shared/.venv
          "; then
            echo "::error::Server no está migrado al layout atómico."
            echo "::error::Ejecutar scripts/bootstrap-atomic-deploy.sh primero."
            echo "::error::Ver docs/atomic-deploy-migration.md"
            exit 1
          fi

      - name: Compute release paths
        id: paths
        run: |
          SHA=${GITHUB_SHA::12}
          echo "sha=$SHA"                                   >> $GITHUB_OUTPUT
          echo "release_dir=/var/www/trading/releases/$SHA" >> $GITHUB_OUTPUT

      - name: Capture previous release (for rollback)
        # Leemos el target del symlink current ANTES de tocarlo. Si el health
        # check post-cutover falla, hacemos `ln -sfn $PREV current` para volver.
        id: prev
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          PREV=$(ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "readlink /var/www/trading/current || echo ''")
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "Previous release symlink target: $PREV"

      - name: Stage release directory
        env:
          HOST:        ${{ secrets.DEPLOY_HOST }}
          RELEASE_DIR: ${{ steps.paths.outputs.release_dir }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "
            mkdir -p ${RELEASE_DIR} &&
            mkdir -p ${RELEASE_DIR}/dist
          "

      - name: rsync backend source to release dir
        env:
          HOST:        ${{ secrets.DEPLOY_HOST }}
          RELEASE_DIR: ${{ steps.paths.outputs.release_dir }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='tests/' --exclude='logs/' \
            --exclude='*.db' --exclude='.venv/' --exclude='__pycache__/' \
            --exclude='frontend/' --exclude='.git/' --exclude='.github/' \
            --exclude='.coverage' --exclude='.pytest_cache/' \
            --exclude='.worktrees/' --exclude='Backtesting_BTCUSDT/' \
            --exclude='Dashboard/' --exclude='docs/' --exclude='*.bat' \
            --exclude='*.ps1' --exclude='.env' --exclude='.env.*' \
            --exclude='.claude/' \
            --exclude='data/' \
            --exclude='dist/' \
            ./ ubuntu@${HOST}:${RELEASE_DIR}/

      - name: rsync frontend dist to release dir
        env:
          HOST:        ${{ secrets.DEPLOY_HOST }}
          RELEASE_DIR: ${{ steps.paths.outputs.release_dir }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ ubuntu@${HOST}:${RELEASE_DIR}/dist/

      - name: Link shared resources into release
        # .env, .venv, data/ viven en shared/ y se linkean dentro del release.
        # Esto garantiza que los releases comparten el mismo virtualenv (sin
        # reinstalar pip deps salvo que requirements cambie) y la misma DB.
        env:
          HOST:        ${{ secrets.DEPLOY_HOST }}
          RELEASE_DIR: ${{ steps.paths.outputs.release_dir }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "
            cd ${RELEASE_DIR} &&
            ln -sfn ../../shared/.env  .env &&
            ln -sfn ../../shared/.venv .venv &&
            ln -sfn ../../shared/data  data
          "

      - name: pip install in new release
        env:
          HOST:        ${{ secrets.DEPLOY_HOST }}
          RELEASE_DIR: ${{ steps.paths.outputs.release_dir }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "
            cd ${RELEASE_DIR} &&
            .venv/bin/pip install --upgrade -r requirements.txt
          "

      - name: Atomic cutover (swap symlink + restart)
        # `mv -Tf` sobre un symlink existente usa rename(2) que es atómico en
        # Linux: el proceso del kernel garantiza que ningún lector ve un
        # estado intermedio. `ln -sfn current.new current` también funciona
        # pero `mv -T` es más explícitamente atómico.
        env:
          HOST:        ${{ secrets.DEPLOY_HOST }}
          RELEASE_DIR: ${{ steps.paths.outputs.release_dir }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "
            cd /var/www/trading &&
            ln -sfn releases/$(basename ${RELEASE_DIR}) current.new &&
            mv -Tf current.new current &&
            sudo systemctl restart trading-spacial
          "

      - name: Health check + auto-rollback on failure
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          sleep 15
          if ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "curl -fsS http://localhost:8100/health"; then
            echo "::notice::Deploy OK. Release activo: ${{ steps.paths.outputs.sha }}"
            exit 0
          fi

          echo "::error::Health check falló post-cutover."
          if [ -n "$PREV" ]; then
            echo "::warning::Rolling back a $PREV..."
            ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "
              cd /var/www/trading &&
              ln -sfn $PREV current.new &&
              mv -Tf current.new current &&
              sudo systemctl restart trading-spacial
            "
            sleep 10
            if ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "curl -fsS http://localhost:8100/health"; then
              echo "::warning::Rollback OK. Release activo: $PREV"
            else
              echo "::error::Rollback también falló. Estado del server desconocido."
              ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "sudo journalctl -u trading-spacial -n 80 --no-pager"
            fi
          else
            echo "::error::No hay release previo registrado para rollback."
          fi
          exit 1

      - name: Cleanup old releases (keep last 5)
        # Sólo si el deploy fue exitoso. Si falló y rolled back, mantenemos
        # el release fallido para inspección manual.
        if: success()
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${HOST} "
            cd /var/www/trading/releases &&
            ls -1t | tail -n +6 | xargs -r rm -rf
          "

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
